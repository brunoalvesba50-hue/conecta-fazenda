<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f6e2a">
<title>Conecta Fazenda — São Bento do Sapucaí</title>
<meta name="description" content="Jogo de fazenda na Serra da Mantiqueira. Gratuito, sem dinheiro real.">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="screen-orientation" content="portrait">
</head>
<body>
<div id="tela">
<canvas id="game" aria-label="Fazenda em São Bento do Sapucaí"></canvas>

<div id="hud" class="hidden">
  <!-- alto à esquerda: nível, experiência e região -->
  <div class="hLvl">
    <div class="star"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z" fill="url(#gs)" stroke="#b97a08" stroke-width="1"/><defs><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe46b"/><stop offset="1" stop-color="#f2a91b"/></linearGradient></defs></svg><b id="hNivel">1</b></div>
    <div class="lvlInfo"><div class="xpbar"><i id="hXpFill"></i><small id="hXp">0 / 40</small></div><span class="reg"><svg viewBox="0 0 24 24"><path d="M12 22s7-7.2 7-12.5A7 7 0 0 0 5 9.5C5 14.8 12 22 12 22z" fill="#e8b44c"/><circle cx="12" cy="9.5" r="2.6" fill="#fff"/></svg><i id="hRegiao">São Bento do Sapucaí</i></span></div>
  </div>
  <!-- alto à direita: moedas (o + mostra como ganhar jogando) -->
  <div class="hRes"><div class="pill" id="hCoins"><span class="coin"></span><b id="hMoedas">0</b><button class="plus" id="bGanhar" aria-label="Como ganhar mais moedas">+</button></div></div>

  <!-- coluna esquerda: botões pequenos -->
  <div class="side sideL">
    <button class="rBtn" id="bConfig" aria-label="Ajustes"><img src="assets/img/ic_config.webp" alt=""></button>
    <button class="rBtn" id="bMissoes" aria-label="Missões"><img src="assets/img/ic_missoes.webp" alt=""><em class="dot hidden" id="dMissao"></em></button>
    <button class="rBtn" id="bCeleiro" aria-label="Celeiro"><img src="assets/img/ic_inventario.webp" alt=""><em class="cnt" id="dCeleiro">0</em></button>
  </div>
  <!-- coluna direita: mapa e zoom -->
  <div class="side sideR">
    <button class="rBtn" id="bMapa" aria-label="Mapa da Mantiqueira"><img src="assets/img/ic_mapa.webp" alt=""></button>
    <div class="zoomBox" id="zoomBox">
      <button id="zIn" aria-label="Aproximar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zOut" aria-label="Afastar"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="zAll" aria-label="Visão geral do mapa"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="zHome" aria-label="Centralizar na fazenda"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg></button>
    </div>
  </div>

  <!-- missão atual: etiqueta pequena -->
  <button class="mChip" id="mChip"><b id="mTitulo"></b><span id="mTexto"></span><i class="mbar"><i id="mFill"></i></i></button>

  <div class="plantBar hidden" id="plantBar"><img id="pbIcon" alt=""><span id="pbTxt"></span><button id="pbOk">Concluir</button></div>

  <!-- embaixo: Construir e Mercado nos cantos; ações rápidas no meio -->
  <nav class="bottom">
    <button class="big" data-a="construir"><img src="assets/img/ic_construir.webp" alt=""><span>Construir</span></button>
    <div class="quick">
      <button data-a="plantar"><img src="assets/img/saco.webp" alt=""><span>Plantar</span></button>
      <button data-a="colher"><img src="assets/img/cesto.webp" alt=""><span>Colher</span><em class="cnt hidden" id="dColher">0</em></button>
      <button data-a="animais"><img src="assets/img/vaca3.webp" alt=""><span>Animais</span><em class="cnt hidden" id="dAnimais">0</em></button>
      <button data-a="produzir"><img src="assets/img/ic_produzir.webp" alt=""><span>Produzir</span><em class="cnt hidden" id="dProduzir">!</em></button>
    </div>
    <button class="big" data-a="mercado"><img src="assets/img/caixa.webp" alt=""><span>Mercado</span></button>
  </nav>
</div>

<!-- tutorial: fazendeiro com balão de fala (não cobre o meio da tela) -->
<div id="tut" class="hidden" role="dialog" aria-live="polite">
  <img class="tutFoto" src="assets/img/fazendeiro.webp" alt="Fazendeiro">
  <div class="tutBalao"><span class="tutNome">Seu Zé, o fazendeiro <i id="tutPasso"></i></span><p id="tutTxt"></p>
    <div class="tutBtns"><button id="tutPular">Pular tutorial</button><button id="tutOk" class="hidden"></button></div></div>
</div>

<!-- mapa regional da Serra da Mantiqueira -->
<div id="regiao" class="hidden">
  <div id="rgCena"><div id="rgWrap"><img src="assets/img/mapa_regional.webp" alt="Mapa ilustrado da Serra da Mantiqueira" draggable="false"></div></div>
  <div class="rgTopo"><button id="rgVoltar" class="rBtn" aria-label="Voltar à fazenda"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="rgPlaca"><b>Conecta Fazenda</b><small>SERRA DA MANTIQUEIRA</small></div></div>
  <div class="rgNav"><button id="rgAnt" aria-label="Cidade anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button id="rgNome"><b>São Bento do Sapucaí</b><small>1 de 11 · Disponível</small></button><button id="rgProx" aria-label="Próxima cidade"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
  <div class="zoomBox rgZoom"><button id="rgIn" aria-label="Aproximar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button id="rgOut" aria-label="Afastar"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><button id="rgCentro" aria-label="Centralizar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg></button></div>
</div>

<div id="sheetBg" class="hidden"></div>
<section id="sheet" class="hidden" role="dialog" aria-modal="true"><header><h2 id="shTitle"></h2><button id="shClose" aria-label="Fechar">×</button></header><div id="shBody"></div></section>
<div id="toast" class="hidden"></div>
<div id="modal" class="hidden"></div>

<div id="loading"><div class="ldBox"><h1>Conecta Fazenda</h1><p>Vale da Mantiqueira</p><div class="ldBar"><i id="ldFill"></i></div><small id="ldTxt">Carregando a fazenda…</small></div></div>

</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
